<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FoodFlow — Customer</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand"><span class="logo-badge">🍔</span> FoodFlow</div>
    <div class="topbar-right">
      <span class="pill-role">Customer</span>
      <div class="avatar-circle" id="avatarInitials">?</div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Log out</button>
    </div>
  </div>

  <div class="container">
    <div class="page-header">
      <div>
        <h1 id="greeting">Hungry?</h1>
        <p>Order from your favorite local restaurants.</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabBrowse" onclick="showTab('browse')">Browse Restaurants</button>
      <button class="tab-btn" id="tabOrders" onclick="showTab('orders')">My Orders <span class="tab-badge" id="ordersCount">0</span></button>
    </div>

    <!-- BROWSE TAB -->
    <div id="browseView">
      <div id="restaurantListWrap"><div class="loading-spin"></div></div>
      <div id="restaurantDetailWrap" style="display:none;"></div>
    </div>

    <!-- ORDERS TAB -->
    <div id="ordersView" style="display:none;">
      <div id="ordersListWrap"><div class="loading-spin"></div></div>
    </div>
  </div>
</div>

<!-- Cart floating button -->
<button class="cart-fab" id="cartFab" style="display:none;" onclick="openCart()">
  🛒 <span id="cartCount">0</span> items · <span id="cartTotal">₹0</span>
</button>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="/js/api.js"></script>
<script src="/customer/app.js"></script>
</body>
</html>
