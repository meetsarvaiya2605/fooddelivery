<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FoodFlow — Restaurant Dashboard</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brand"><span class="logo-badge">🍽️</span> FoodFlow</div>
    <div class="topbar-right">
      <span class="pill-role">Restaurant</span>
      <label class="switch" title="Open / Closed">
        <input type="checkbox" id="openToggle" onchange="toggleOpen()" />
        <span class="slider"></span>
      </label>
      <span class="small muted" id="openLabel">Closed</span>
      <div class="avatar-circle" id="avatarInitials">?</div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Log out</button>
    </div>
  </div>

  <div class="container">
    <div class="page-header">
      <div>
        <h1 id="restName">Your Restaurant</h1>
        <p>Manage your menu, incoming orders, and restaurant profile.</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('orders')" id="tabOrders">Incoming Orders <span class="tab-badge" id="pendingCount">0</span></button>
      <button class="tab-btn" onclick="showTab('menu')" id="tabMenu">Menu</button>
      <button class="tab-btn" onclick="showTab('profile')" id="tabProfile">Restaurant Profile</button>
    </div>

    <div id="ordersView"><div class="loading-spin"></div></div>

    <div id="menuView" style="display:none;">
      <div class="flex-between mb-16">
        <div></div>
        <button class="btn btn-primary btn-sm" onclick="openMenuModal()">+ Add menu item</button>
      </div>
      <div id="menuListWrap"><div class="loading-spin"></div></div>
    </div>

    <div id="profileView" style="display:none;">
      <div class="card" style="max-width:560px;">
        <div class="form-group">
          <label>Restaurant name</label>
          <input type="text" id="pName" />
        </div>
        <div class="form-group">
          <label>Cuisine</label>
          <input type="text" id="pCuisine" placeholder="e.g. Italian, Chinese, North Indian" />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="pDescription" placeholder="Tell customers about your restaurant"></textarea>
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" id="pAddress" />
        </div>
        <div class="form-group">
          <label>Pickup location (for accurate ₹/km delivery pricing)</label>
          <button type="button" class="btn btn-outline btn-sm btn-block" id="pLocBtn" onclick="captureRestaurantLocation()">📍 Set current location as pickup point</button>
          <p class="small muted mt-8" id="pLocStatus">No location set yet.</p>
        </div>
        <div class="form-group">
          <label>Image URL</label>
          <input type="text" id="pImage" placeholder="https://..." />
        </div>
        <button class="btn btn-primary" onclick="saveProfile()">Save changes</button>
      </div>
    </div>
  </div>
</div>

<!-- Menu item modal -->
<div class="modal-overlay" id="menuModal" style="display:none;">
  <div class="modal-box">
    <h2 id="menuModalTitle">Add menu item</h2>
    <input type="hidden" id="menuItemId" />
    <div class="form-group"><label>Name</label><input type="text" id="miName" /></div>
    <div class="form-group"><label>Description</label><textarea id="miDescription"></textarea></div>
    <div class="form-group"><label>Category</label><input type="text" id="miCategory" placeholder="e.g. Pizza, Starters" /></div>
    <div class="form-group"><label>Price (₹)</label><input type="number" id="miPrice" step="0.01" min="0" /></div>
    <div class="form-group"><label>Image URL</label><input type="text" id="miImage" placeholder="https://..." /></div>
    <div class="form-group flex gap-8" style="align-items:center;">
      <input type="checkbox" id="miAvailable" style="width:auto;" checked />
      <label style="margin:0;">Available</label>
    </div>
    <div class="flex gap-8 mt-16">
      <button class="btn btn-primary" onclick="saveMenuItem()">Save</button>
      <button class="btn btn-ghost" onclick="closeMenuModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/restaurant/app.js"></script>
</body>
</html>
