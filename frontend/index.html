<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FoodFlow — Food Delivery</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="center-logo">🍔</div>
    <h1>FoodFlow</h1>
    <p class="sub">Order food, run a kitchen, or deliver — all in one place.</p>

    <div class="auth-toggle">
      <button id="tabLogin" class="active" onclick="switchTab('login')">Login</button>
      <button id="tabRegister" onclick="switchTab('register')">Create account</button>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
      <p class="small muted" style="text-align:center; margin-top:14px;">
        Demo accounts (after running seed.py):<br/>
        customer@demo.com · restaurant@demo.com · rider@demo.com · admin@demo.com<br/>
        password: <b>password123</b>
      </p>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" style="display:none;">
      <div class="form-group">
        <label>I am a</label>
        <div class="role-select">
          <div class="role-option active" data-role="customer" onclick="pickRole('customer')">
            <span class="emoji">🧑‍🍳</span>Customer
          </div>
          <div class="role-option" data-role="restaurant" onclick="pickRole('restaurant')">
            <span class="emoji">🍽️</span>Restaurant
          </div>
          <div class="role-option" data-role="delivery" onclick="pickRole('delivery')">
            <span class="emoji">🛵</span>Delivery
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>Full name</label>
        <input type="text" id="regName" placeholder="Jane Doe" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="regPhone" placeholder="+91 98765 43210" />
      </div>
      <div class="form-group">
        <label id="regAddressLabel">Delivery address</label>
        <input type="text" id="regAddress" placeholder="Street, city" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Choose a password" required minlength="6" />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  // If already logged in, go straight to dashboard
  const existing = Auth.getUser();
  if (existing) window.location.href = roleHome(existing.role);

  let selectedRole = "customer";

  function switchTab(tab) {
    document.getElementById("tabLogin").classList.toggle("active", tab === "login");
    document.getElementById("tabRegister").classList.toggle("active", tab === "register");
    document.getElementById("loginForm").style.display = tab === "login" ? "block" : "none";
    document.getElementById("registerForm").style.display = tab === "register" ? "block" : "none";
  }

  function pickRole(role) {
    selectedRole = role;
    document.querySelectorAll(".role-option").forEach((el) => {
      el.classList.toggle("active", el.dataset.role === role);
    });
    const label = document.getElementById("regAddressLabel");
    if (role === "customer") label.textContent = "Delivery address";
    else if (role === "restaurant") label.textContent = "Restaurant address";
    else label.textContent = "Home address";
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    try {
      const data = await api("/api/auth/login", { method: "POST", body: { email, password }, auth: false });
      Auth.setSession(data.access_token, data.user);
      toast(`Welcome back, ${data.user.name.split(" ")[0]}!`, "success");
      setTimeout(() => (window.location.href = roleHome(data.user.role)), 400);
    } catch (err) {
      toast(err.message, "error");
    }
  });

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      name: document.getElementById("regName").value.trim(),
      email: document.getElementById("regEmail").value.trim(),
      phone: document.getElementById("regPhone").value.trim(),
      address: document.getElementById("regAddress").value.trim(),
      password: document.getElementById("regPassword").value,
      role: selectedRole,
    };
    try {
      const data = await api("/api/auth/register", { method: "POST", body: payload, auth: false });
      Auth.setSession(data.access_token, data.user);
      toast("Account created!", "success");
      setTimeout(() => (window.location.href = roleHome(data.user.role)), 400);
    } catch (err) {
      toast(err.message, "error");
    }
  });
</script>
</body>
</html>
